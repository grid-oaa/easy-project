server:
  port: 8080

spring:
  config:
    import: "optional:nacos:"
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.200.128:8848}
      config:
        enabled: false
        server-addr: ${NACOS_ADDR:192.168.200.128:8848}
        file-extension: yaml
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.200.128:8858}
      eager: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

# 说明：网关仅做基础路由与限流示例，业务鉴权将在后续阶段完善
